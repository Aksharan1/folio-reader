name: Release

# Push a version tag (git tag v1.2.0 && git push --tags) to build Folio for Windows, macOS and
# Linux and publish them as a GitHub release. Run it by hand (Actions → Release → Run workflow)
# to build the same files without publishing; they're kept as the run's artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - if: runner.os != 'Linux'
        run: npm test
      - run: npm run dist -- --publish never
      # install each package the way a user would, and check Folio lands where it should
      - name: Install check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process dist\Folio-Setup-Windows.exe -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Folio\Folio.exe'
          if (-not (Test-Path $exe)) { throw "Folio.exe was not installed" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Folio.lnk'
          if (-not (Test-Path $menu)) { throw "no Start menu shortcut" }
          Get-Process Folio -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "installed: $exe"
      - name: Install check (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/Folio-macOS.dmg -nobrowse -mountpoint /tmp/folio-dmg
          ls /tmp/folio-dmg
          lipo -archs /tmp/folio-dmg/Folio.app/Contents/MacOS/Folio | tee /tmp/archs
          grep -q x86_64 /tmp/archs && grep -q arm64 /tmp/archs
          codesign --verify --deep /tmp/folio-dmg/Folio.app
          test -L /tmp/folio-dmg/Applications
          hdiutil detach /tmp/folio-dmg
      - name: Install check (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/Folio-Linux.deb
          test -x /opt/Folio/folio-reader || test -x /opt/Folio/folio
          ls /usr/share/applications | grep -i folio
          chmod +x dist/Folio-Linux.AppImage
          (cd /tmp && "$GITHUB_WORKSPACE/dist/Folio-Linux.AppImage" --appimage-extract > /dev/null && test -d squashfs-root)
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the notes start with which file to pick, then this version's section of CHANGELOG.md
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          ## Download

          Pick the one file for your computer:

          | Your computer | Download | Then |
          | --- | --- | --- |
          | **Windows 10 or 11** | **[Folio-Setup-Windows.exe]($base/Folio-Setup-Windows.exe)** | Double-click it. Folio installs and opens, with a shortcut on your desktop and in the Start menu. |
          | **Mac** (Apple silicon or Intel) | **[Folio-macOS.dmg]($base/Folio-macOS.dmg)** | Open it and drag Folio into Applications. |
          | **Ubuntu, Debian, Mint** | **[Folio-Linux.deb]($base/Folio-Linux.deb)** | Double-click it to install with your software centre. |
          | **Other Linux** | [Folio-Linux.AppImage]($base/Folio-Linux.AppImage) | Allow it to run as a program (right-click → Properties), then double-click it. |

          Want Folio on a USB stick instead? [Folio-Portable-Windows.exe]($base/Folio-Portable-Windows.exe) runs without installing.

          First launch: Windows SmartScreen may ask, choose **More info → Run anyway**. On a Mac, if it says it can't check Folio, open **System Settings → Privacy & Security** and choose **Open Anyway**.

          ## What's new

          EOF
          awk -v v="## $version" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md >> notes.md
          gh release create "$GITHUB_REF_NAME" files/* --title "Folio $version" --notes-file notes.md
